    const COLUMNS = [
      { key: "name", label: "Model", type: "text", compact: true, render: (m) => {
          const href = m.docsUrl;
          return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(m.name)}</a>`;
        }},
      { key: "priceIndex", label: "Est. cost ($/M)", type: "money", compact: true, computed: true },
      { key: "provider", label: "Provider", type: "text", compact: true },
      { key: "speedTier", label: "Speed", type: "tier", compact: true },
      { key: "intelligenceTier", label: "Intelligence", type: "tier", compact: true },
      { key: "costTier", label: "Cost tier", type: "tier", compact: true },
      { key: "input", label: "Input ($/M)", type: "money", compact: true },
      { key: "output", label: "Output ($/M)", type: "money", compact: true },
      { key: "cacheWrite", label: "Cache write ($/M)", type: "money", compact: true },
      { key: "cacheRead", label: "Cache read ($/M)", type: "money", compact: true },
      { key: "contextWindow", label: "Context", type: "text", compact: true },
      { key: "maxContextWindow", label: "Max context", type: "text", compact: true },
      { key: "thinking", label: "Thinking", type: "bool", compact: true },
      { key: "isMax", label: "Max mode", type: "bool", compact: true },
      { key: "isAgent", label: "Agent", type: "bool", compact: true },
      { key: "supportsImage", label: "Images", type: "bool", compact: true },
      { key: "recommendation", label: "Recommendation", type: "long" },
      { key: "summary", label: "Summary", type: "long" },
      { key: "strengths", label: "Strengths", type: "list" },
      { key: "limitations", label: "Limitations", type: "list" },
      { key: "notes", label: "Notes", type: "list" },
      { key: "pricingNotes", label: "Pricing notes", type: "long" },
      { key: "externalLink", label: "Provider link", type: "link" },
    ];

    const DEFAULT_VISIBLE = new Set([
      "name", "priceIndex", "provider", "speedTier", "intelligenceTier",
      "costTier", "contextWindow", "maxContextWindow", "recommendation",
      "isAgent", "supportsImage"
    ]);

    const BLEND_PRESETS = {
      inputOnly: {
        outputPct: 0,
        help: "Input only: est. cost uses the input price alone. Best when usage is almost entirely context, tools, and prompts with little generation.",
      },
      context: {
        outputPct: 25,
        help: "Context-heavy (75/25): weights input more. Best when large codebase context, Max Mode, and tool results dominate your token usage — typical for Cursor agent sessions.",
      },
      balanced: {
        outputPct: 50,
        help: "Balanced (50/50): treats input and output token volume equally. A neutral default when you are not sure how you use models.",
      },
      output: {
        outputPct: 75,
        help: "Output-heavy (25/75): weights output more. Best when prompts are short but the model generates a lot of text or code — less typical for agent loops, more like batch generation.",
      },
      outputOnly: {
        outputPct: 100,
        help: "Output only: est. cost uses the output price alone. Best when generation dominates and input volume is negligible.",
      },
      custom: {
        outputPct: null,
        help: "Custom blend: drag toward Input or Output to match your token mix. Formula: (input% × input price) + (output% × output price).",
      },
    };

    const TIER_ORDER = {
      "": 0, low: 1, moderate: 2, medium: 2, high: 3, fast: 3,
      "very-high": 4, max: 5, frontier: 6,
    };

    let outputWeight = 0.5;
    let sortKey = "priceIndex";
    let sortDir = 1;
    let visibleCols = new Set(DEFAULT_VISIBLE);

    const $ = (sel) => document.querySelector(sel);

    function computePriceIndex(model) {
      const inp = model.input;
      const out = model.output;
      if (inp == null || inp === "" || out == null || out === "") return null;
      const inputWeight = 1 - outputWeight;
      return inputWeight * Number(inp) + outputWeight * Number(out);
    }

    function withPriceIndex(models) {
      return models.map((m) => ({ ...m, priceIndex: computePriceIndex(m) }));
    }

    function blendLabel(inputPct) {
      const outputPct = 100 - inputPct;
      return `${inputPct}% input · ${outputPct}% output`;
    }

    function blendTitle() {
      const outputPct = Math.round(outputWeight * 100);
      const inputPct = 100 - outputPct;
      return `${inputPct}% input + ${outputPct}% output price blend`;
    }

    function detectPreset(outputPct) {
      for (const [key, preset] of Object.entries(BLEND_PRESETS)) {
        if (key !== "custom" && preset.outputPct === outputPct) return key;
      }
      return "custom";
    }

    function updateBlendUI() {
      const outputPct = Math.round(outputWeight * 100);
      const inputPct = 100 - outputPct;
      const presetKey = detectPreset(outputPct);
      const preset = BLEND_PRESETS[presetKey];

      $("#blend-preset").value = presetKey;
      $("#blend-output").value = String(outputPct);
      $("#blend-formula").textContent = blendLabel(inputPct);
      $("#blend-input-val").textContent = blendLabel(inputPct);
      $("#blend-help").textContent = preset.help;

      const priceCol = COLUMNS.find((c) => c.key === "priceIndex");
      if (priceCol) priceCol.title = blendTitle();
    }

    function setOutputWeight(outputPct) {
      outputWeight = Math.min(100, Math.max(0, outputPct)) / 100;
      updateBlendUI();
      try {
        localStorage.setItem("cursor-prices-blend", String(Math.round(outputWeight * 100)));
      } catch (_) {}
      render();
    }

    function initBlendControls() {
      try {
        const saved = localStorage.getItem("cursor-prices-blend");
        if (saved != null && saved !== "") {
          setOutputWeight(Number(saved));
        } else {
          updateBlendUI();
        }
      } catch (_) {
        updateBlendUI();
      }

      $("#blend-preset").addEventListener("change", (e) => {
        const key = e.target.value;
        if (key === "custom") return;
        setOutputWeight(BLEND_PRESETS[key].outputPct);
      });

      $("#blend-output").addEventListener("input", (e) => {
        setOutputWeight(Number(e.target.value));
      });
    }

    function initThemeToggle() {
      const root = document.documentElement;
      const buttons = document.querySelectorAll(".theme-toggle button");

      function syncButtons() {
        const current = root.dataset.theme || "system";
        buttons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.theme === current);
        });
      }

      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.dataset.theme;
          root.dataset.theme = mode;
          try {
            localStorage.setItem("cursor-prices-theme", mode);
          } catch (_) {}
          syncButtons();
        });
      });

      syncButtons();
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function mdInline(text) {
      return esc(text)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function fmtMoney(v) {
      if (v === null || v === undefined || v === "" || v === "-") return "—";
      return "$" + Number(v).toFixed(v % 1 ? 2 : 0).replace(/\.?0+$/, (m) => m.startsWith(".") ? "" : m);
    }

    function fmtBool(v) {
      return v
        ? '<span class="bool-yes">Yes</span>'
        : '<span class="bool-no">No</span>';
    }

    function fmtTier(v, colKey) {
      if (!v) return "—";
      const norm = String(v).toLowerCase().replace(/\s+/g, "-");
      let cls = norm;
      if (colKey === "speedTier" && norm === "fast") cls = "good";
      else if (colKey === "intelligenceTier" && norm === "frontier") cls = "best";
      else if (colKey === "intelligenceTier" && norm === "high") cls = "good";
      else if (colKey === "intelligenceTier" && norm === "moderate") cls = "medium";
      return `<span class="pill ${esc(cls)}">${esc(v)}</span>`;
    }

    function cellValue(m, col) {
      const v = m[col.key];
      switch (col.type) {
        case "money": return fmtMoney(v);
        case "bool": return fmtBool(v);
        case "tier": return fmtTier(v, col.key);
        case "list":
          if (!Array.isArray(v) || !v.length) return "—";
          return `<ul class="list">${v.map((i) => `<li>${mdInline(i)}</li>`).join("")}</ul>`;
        case "long":
          if (!v) return "—";
          if (col.key === "recommendation") return `<div class="rec">${mdInline(v)}</div>`;
          return `<div class="summary">${mdInline(v)}</div>`;
        case "link":
          if (!v) return "—";
          return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\//, ""))}</a>`;
        default:
          if (col.render) return col.render(m);
          return esc(v || "—");
      }
    }

    function sortValue(m, col) {
      const v = m[col.key];
      if (col.type === "money") return v == null || v === "" ? Infinity : Number(v);
      if (col.type === "bool") return v ? 1 : 0;
      if (col.type === "tier") return TIER_ORDER[String(v || "").toLowerCase()] ?? 99;
      if (col.type === "list") return Array.isArray(v) ? v.join(" ").toLowerCase() : "";
      return String(v ?? "").toLowerCase();
    }

    function filteredModels() {
      const q = $("#search").value.trim().toLowerCase();
      const provider = $("#filter-provider").value;
      return DATA.models.filter((m) => {
        if (provider && m.provider !== provider) return false;
        if (!q) return true;
        const hay = [m.name, m.provider, m.slug, m.tagline, ...(m.notes || [])]
          .join(" ")
          .toLowerCase();
        return hay.includes(q);
      });
    }

    function renderHeader() {
      $("#header-row").innerHTML = COLUMNS.filter((c) => visibleCols.has(c.key)).map((col) => {
        const sorted = col.key === sortKey;
        const arrow = sorted ? (sortDir > 0 ? "↑" : "↓") : "↕";
        const title = col.title ? ` title="${esc(col.title)}"` : "";
        return `<th data-key="${col.key}" class="${sorted ? "sorted" : ""}"${title}>${esc(col.label)}<span class="arrow">${arrow}</span></th>`;
      }).join("");
      $("#header-row").querySelectorAll("th").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.key;
          if (sortKey === key) sortDir *= -1;
          else { sortKey = key; sortDir = 1; }
          render();
        });
      });
    }

    function renderBody(models) {
      const enriched = withPriceIndex(models);
      const cols = COLUMNS.filter((c) => visibleCols.has(c.key));
      const col = COLUMNS.find((c) => c.key === sortKey) || COLUMNS[0];
      enriched.sort((a, b) => {
        const av = sortValue(a, col);
        const bv = sortValue(b, col);
        if (av < bv) return -1 * sortDir;
        if (av > bv) return 1 * sortDir;
        return a.name.localeCompare(b.name);
      });

      $("#body").innerHTML = enriched.map((m) => {
        const tds = cols.map((c) => {
          const cls = c.compact ? "" : ' class="wide"';
          return `<td${cls}>${cellValue(m, c)}</td>`;
        }).join("");
        return `<tr>${tds}</tr>`;
      }).join("");
      $("#visible-count").textContent = `${models.length} models`;
    }

    function renderColToggle() {
      $("#col-toggle").innerHTML = COLUMNS.map((col) => {
        const checked = visibleCols.has(col.key) ? "checked" : "";
        return `<label><input type="checkbox" data-col="${col.key}" ${checked}> ${esc(col.label)}</label>`;
      }).join("");
      $("#col-toggle").querySelectorAll("input").forEach((input) => {
        input.addEventListener("change", () => {
          if (input.checked) visibleCols.add(input.dataset.col);
          else visibleCols.delete(input.dataset.col);
          render();
        });
      });
    }

    function renderProviders() {
      const providers = [...new Set(DATA.models.map((m) => m.provider).filter(Boolean))].sort();
      const sel = $("#filter-provider");
      providers.forEach((p) => {
        const opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        sel.appendChild(opt);
      });
    }

    function render() {
      renderHeader();
      renderBody(filteredModels());
    }

    renderProviders();
    renderColToggle();
    initThemeToggle();
    initBlendControls();
    render();
    $("#search").addEventListener("input", render);
    $("#filter-provider").addEventListener("change", render);
  </script>
</body>
